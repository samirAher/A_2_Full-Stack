
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Employee Registration</h1>
        <p class="subtitle">Please fill in your details below</p>

        <form id="employeeForm">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
            <small id="nameError"></small>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="example@gmail.com" required>
            <small id="emailError"></small>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Minimum 8 characters" required>
            <small id="passwordError"></small>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter 10-digit phone number" maxlength="10" required>
            <small id="phoneError"></small>

            <label for="department">Department</label>
            <select id="department" required>
                <option value="">-- Select Department --</option>
                <option value="IT">Information Technology</option>
                <option value="HR">Human Resources</option>
                <option value="Finance">Finance</option>
                <option value="Marketing">Marketing</option>
                <option value="Sales">Sales</option>
                <option value="Operations">Operations</option>
            </select>
            <small id="departmentError"></small>

            <button type="submit">Register Employee</button>

            <p id="message" role="status"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
